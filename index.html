<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alona</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: #ff69b4;
        min-height: 200vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
        padding: 21px;
        overflow: hidden;
      }

      #main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 60px;
      }

      #headline {
        color: white;
        font-size: clamp(3rem, 15vw, 9rem);
        font-weight: 900;
        text-align: center;
        line-height: 1.1;
      }

      #btn {
        background-color: white;
        color: #ff69b4;
        border: none;
        border-radius: 20px;
        padding: 30px 80px;
        font-size: clamp(2rem, 8vw, 5rem);
        font-weight: 900;
        cursor: pointer;
        transition: transform 0.1s;
      }

      #btn:active {
        transform: scale(0.95);
      }

      #love {
        display: none;
        color: white;
        font-size: clamp(3rem, 13vw, 8rem);
        font-weight: 900;
        text-align: center;
        line-height: 1.2;
        animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      @keyframes popIn {
        0% {
          transform: scale(0.5);
          opacity: 0;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }

      /* Animation overlay */
      #anim {
        display: none;
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }

      /* Flash burst */
      #flash {
        display: none;
        position: fixed;
        inset: 0;
        background: white;
        z-index: 9;
        animation: flash 0.4s ease-out forwards;
      }

      @keyframes flash {
        0% {
          opacity: 0.9;
        }
        100% {
          opacity: 0;
        }
      }

      .particle {
        position: absolute;
        pointer-events: none;
        animation: rise linear forwards;
      }

      .heart {
        font-size: 2rem;
        animation-name: riseHeart;
      }

      .spark {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        animation-name: riseSpark;
      }

      @keyframes riseHeart {
        0% {
          transform: translateY(0) scale(1) rotate(0deg);
          opacity: 1;
        }
        80% {
          opacity: 1;
        }
        100% {
          transform: translateY(-90vh) scale(1.4) rotate(30deg);
          opacity: 0;
        }
      }

      @keyframes riseSpark {
        0% {
          transform: translate(0, 0) scale(1);
          opacity: 1;
        }
        100% {
          transform: translate(var(--dx), var(--dy)) scale(0);
          opacity: 0;
        }
      }

      @keyframes shine {
        0%,
        100% {
          opacity: 0;
          transform: scale(0.5);
        }
        50% {
          opacity: 1;
          transform: scale(1.4);
        }
      }

      .glow {
        position: absolute;
        border-radius: 50%;
        animation: shine ease-in-out infinite;
      }
    </style>
  </head>
  <body>
    <div id="main">
      <p id="headline">Press the button</p>
      <button id="btn" onclick="startAnim()">Button</button>
    </div>

    <div id="flash"></div>
    <div id="anim"></div>
    <p id="love">This user @dimanamee loves you. Very much. ❤️</p>

    <script>
      function startAnim() {
        document.getElementById("main").style.display = "none";

        const flash = document.getElementById("flash");
        flash.style.display = "block";
        setTimeout(() => (flash.style.display = "none"), 400);

        const anim = document.getElementById("anim");
        anim.style.display = "block";

        const hearts = ["❤️", "💖", "💗", "💓", "💝", "🩷"];
        const sparkColors = [
          "#fff",
          "#ffb6c1",
          "#ffe4e1",
          "#ffd700",
          "#fff0f5",
          "#ff85c2",
        ];

        const total = 60;
        for (let i = 0; i < total; i++) {
          setTimeout(() => {
            spawnHeart(anim, hearts);
            spawnSpark(anim, sparkColors);
            spawnGlow(anim);
          }, i * 45);
        }

        setTimeout(() => {
          anim.style.display = "none";
          document.getElementById("love").style.display = "block";
        }, 3000);
      }

      function spawnHeart(parent, hearts) {
        const el = document.createElement("div");
        el.className = "particle heart";
        el.textContent = hearts[Math.floor(Math.random() * hearts.length)];
        el.style.left = Math.random() * 100 + "vw";
        el.style.top = 60 + Math.random() * 40 + "vh";
        el.style.fontSize = 1.2 + Math.random() * 2.5 + "rem";
        const dur = (1.5 + Math.random() * 1.5).toFixed(2);
        el.style.animationDuration = dur + "s";
        el.style.animationFillMode = "forwards";
        parent.appendChild(el);
        setTimeout(() => el.remove(), parseFloat(dur) * 1000 + 100);
      }

      function spawnSpark(parent, colors) {
        const count = 3 + Math.floor(Math.random() * 4);
        for (let i = 0; i < count; i++) {
          const el = document.createElement("div");
          el.className = "particle spark";
          const angle = Math.random() * 360;
          const dist = 30 + Math.random() * 120;
          const dx =
            (Math.cos((angle * Math.PI) / 180) * dist).toFixed(1) + "px";
          const dy =
            (Math.sin((angle * Math.PI) / 180) * dist - 80).toFixed(1) + "px";
          el.style.setProperty("--dx", dx);
          el.style.setProperty("--dy", dy);
          el.style.left = 10 + Math.random() * 80 + "vw";
          el.style.top = 10 + Math.random() * 80 + "vh";
          el.style.width = el.style.height = 3 + Math.random() * 7 + "px";
          el.style.background =
            colors[Math.floor(Math.random() * colors.length)];
          const dur = (0.5 + Math.random() * 1).toFixed(2);
          el.style.animationDuration = dur + "s";
          el.style.animationFillMode = "forwards";
          parent.appendChild(el);
          setTimeout(() => el.remove(), parseFloat(dur) * 1000 + 100);
        }
      }

      function spawnGlow(parent) {
        const el = document.createElement("div");
        el.className = "glow";
        const size = 20 + Math.random() * 60;
        el.style.width = el.style.height = size + "px";
        el.style.left = Math.random() * 100 + "vw";
        el.style.top = Math.random() * 100 + "vh";
        const hue =
          Math.random() > 0.5
            ? "rgba(255,255,255,0.8)"
            : "rgba(255,150,200,0.7)";
        el.style.background = hue;
        el.style.boxShadow = `0 0 ${size}px ${size / 2}px ${hue}`;
        const dur = (0.4 + Math.random() * 0.8).toFixed(2);
        el.style.animationDuration = dur + "s";
        parent.appendChild(el);
        setTimeout(() => el.remove(), 1200);
      }
    </script>
  </body>
</html>
