<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alona</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: #ff69b4;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
        padding: 20px;
        overflow: hidden;
      }

      #main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 60px;
      }

      #headline {
        color: white;
        font-size: clamp(3rem, 15vw, 9rem);
        font-weight: 900;
        text-align: center;
        line-height: 1.1;
      }

      #btn {
        background-color: white;
        color: #ff69b4;
        border: none;
        border-radius: 20px;
        padding: 30px 80px;
        font-size: clamp(2rem, 8vw, 5rem);
        font-weight: 900;
        cursor: pointer;
        transition: transform 0.1s;
      }

      #btn:active {
        transform: scale(0.95);
      }

      #btn2 {
        background-color: white;
        color: #ff69b4;
        border: none;
        border-radius: 20px;
        padding: 30px 80px;
        font-size: clamp(2rem, 8vw, 5rem);
        font-weight: 900;
        cursor: pointer;
        transition: transform 0.1s;
      }

      #btn2:active {
        transform: scale(0.95);
      }

      #btn3 {
        background-color: #111;
        color: white;
        border: none;
        border-radius: 20px;
        padding: 30px 80px;
        font-size: clamp(2rem, 8vw, 5rem);
        font-weight: 900;
        cursor: pointer;
        transition: transform 0.1s;
      }

      #btn3:active {
        transform: scale(0.95);
      }

      /* Questions overlay */
      #questions-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: #111;
        z-index: 30;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 40px;
        padding: 40px;
      }

      #question-anim {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 31;
      }

      #question-text {
        color: white;
        font-size: clamp(1.4rem, 5vw, 3rem);
        font-weight: 700;
        text-align: center;
        line-height: 1.4;
        max-width: 800px;
        animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        z-index: 32;
      }

      #question-buttons {
        display: flex;
        gap: 30px;
        z-index: 32;
        animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.2s both;
      }

      #btn-yes {
        background: #2ecc40;
        color: white;
        border: none;
        border-radius: 16px;
        padding: 20px 60px;
        font-size: clamp(1.5rem, 5vw, 3rem);
        font-weight: 900;
        cursor: pointer;
        transition: transform 0.1s;
      }

      #btn-yes:active {
        transform: scale(0.95);
      }

      #btn-no {
        background: #e74c3c;
        color: white;
        border: none;
        border-radius: 16px;
        padding: 20px 60px;
        font-size: clamp(1.5rem, 5vw, 3rem);
        font-weight: 900;
        cursor: pointer;
        transition: transform 0.1s;
      }

      #btn-no:active {
        transform: scale(0.95);
      }

      #questions-final {
        display: none;
        color: white;
        font-size: clamp(2rem, 8vw, 5rem);
        font-weight: 900;
        text-align: center;
        line-height: 1.3;
        animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        padding: 20px;
        z-index: 32;
      }

      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20% { transform: translateX(-12px); }
        40% { transform: translateX(12px); }
        60% { transform: translateX(-8px); }
        80% { transform: translateX(8px); }
      }

      .shake {
        animation: shake 0.5s ease-in-out;
      }

      #night-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: #6b1a33;
        z-index: 20;
        align-items: center;
        justify-content: center;
        flex-direction: column;
      }

      #night-msg {
        color: #fff5e4;
        font-size: clamp(3rem, 13vw, 8rem);
        font-weight: 900;
        text-align: center;
        line-height: 1.2;
        display: none;
        animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        padding: 20px;
        z-index: 22;
      }

      #night-anim {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 21;
      }

      #love {
        display: none;
        color: white;
        font-size: clamp(3rem, 13vw, 8rem);
        font-weight: 900;
        text-align: center;
        line-height: 1.2;
        animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      @keyframes popIn {
        0% {
          transform: scale(0.5);
          opacity: 0;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }

      /* Animation overlay */
      #anim {
        display: none;
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }

      /* Flash burst */
      #flash {
        display: none;
        position: fixed;
        inset: 0;
        background: white;
        z-index: 9;
        animation: flash 0.4s ease-out forwards;
      }

      @keyframes flash {
        0% {
          opacity: 0.9;
        }
        100% {
          opacity: 0;
        }
      }

      .particle {
        position: absolute;
        pointer-events: none;
        animation: rise linear forwards;
      }

      .heart {
        font-size: 2rem;
        animation-name: riseHeart;
      }

      .spark {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        animation-name: riseSpark;
      }

      @keyframes riseHeart {
        0% {
          transform: translateY(0) scale(1) rotate(0deg);
          opacity: 1;
        }
        80% {
          opacity: 1;
        }
        100% {
          transform: translateY(-90vh) scale(1.4) rotate(30deg);
          opacity: 0;
        }
      }

      @keyframes riseSpark {
        0% {
          transform: translate(0, 0) scale(1);
          opacity: 1;
        }
        100% {
          transform: translate(var(--dx), var(--dy)) scale(0);
          opacity: 0;
        }
      }

      @keyframes shine {
        0%,
        100% {
          opacity: 0;
          transform: scale(0.5);
        }
        50% {
          opacity: 1;
          transform: scale(1.4);
        }
      }

      .glow {
        position: absolute;
        border-radius: 50%;
        animation: shine ease-in-out infinite;
      }
    </style>
  </head>
  <body>
    <div id="main">
      <p id="headline">Press the button</p>
      <button id="btn" onclick="startAnim()">Button</button>
      <button id="btn2" onclick="startNightAnim()">not a button</button>
      <button id="btn3" onclick="startQuestions()">Questions</button>
    </div>

    <div id="flash"></div>
    <div id="anim"></div>
    <p id="love">Люблю тебя. Very much. ❤️</p>

    <div id="questions-overlay">
      <div id="question-anim"></div>
      <p id="question-text"></p>
      <div id="question-buttons">
        <button id="btn-yes" onclick="answerYes()">Да ✅</button>
        <button id="btn-no" onclick="answerNo()">Нет ❌</button>
      </div>
      <p id="questions-final"></p>
    </div>

    <div id="night-overlay">
      <div id="night-anim"></div>
      <p id="night-msg">good night, my love 🌙</p>
    </div>

    <script>
      function startAnim() {
        document.getElementById("main").style.display = "none";

        const flash = document.getElementById("flash");
        flash.style.display = "block";
        setTimeout(() => (flash.style.display = "none"), 400);

        const anim = document.getElementById("anim");
        anim.style.display = "block";

        const hearts = ["❤️", "💖", "💗", "💓", "💝", "🩷"];
        const sparkColors = [
          "#fff",
          "#ffb6c1",
          "#ffe4e1",
          "#ffd700",
          "#fff0f5",
          "#ff85c2",
        ];

        const total = 60;
        for (let i = 0; i < total; i++) {
          setTimeout(() => {
            spawnHeart(anim, hearts);
            spawnSpark(anim, sparkColors);
            spawnGlow(anim);
          }, i * 45);
        }

        setTimeout(() => {
          anim.style.display = "none";
          document.getElementById("love").style.display = "block";
        }, 3000);
      }

      function startNightAnim() {
        document.getElementById("main").style.display = "none";

        const overlay = document.getElementById("night-overlay");
        overlay.style.display = "flex";

        const nightAnim = document.getElementById("night-anim");

        const hearts = ["❤️", "💖", "💗", "💓", "💝", "🌸", "🩷"];
        const sparkColors = [
          "#ffd9e8",
          "#ffb3cc",
          "#ff85aa",
          "#ffe4ee",
          "#fff5e4",
          "#c2507a",
        ];

        const total = 60;
        for (let i = 0; i < total; i++) {
          setTimeout(() => {
            spawnHeart(nightAnim, hearts);
            spawnSpark(nightAnim, sparkColors);
            spawnNightGlow(nightAnim);
          }, i * 45);
        }

        setTimeout(() => {
          const msg = document.getElementById("night-msg");
          msg.style.display = "block";
        }, 3000);
      }

      function spawnNightGlow(parent) {
        const el = document.createElement("div");
        el.className = "glow";
        const size = 20 + Math.random() * 60;
        el.style.width = el.style.height = size + "px";
        el.style.left = Math.random() * 100 + "vw";
        el.style.top = Math.random() * 100 + "vh";
        const hue =
          Math.random() > 0.5
            ? "rgba(255,200,220,0.5)"
            : "rgba(200,80,120,0.4)";
        el.style.background = hue;
        el.style.boxShadow = `0 0 ${size}px ${size / 2}px ${hue}`;
        const dur = (0.4 + Math.random() * 0.8).toFixed(2);
        el.style.animationDuration = dur + "s";
        parent.appendChild(el);
        setTimeout(() => el.remove(), 1200);
      }

      function spawnHeart(parent, hearts) {
        const el = document.createElement("div");
        el.className = "particle heart";
        el.textContent = hearts[Math.floor(Math.random() * hearts.length)];
        el.style.left = Math.random() * 100 + "vw";
        el.style.top = 60 + Math.random() * 40 + "vh";
        el.style.fontSize = 1.2 + Math.random() * 2.5 + "rem";
        const dur = (1.5 + Math.random() * 1.5).toFixed(2);
        el.style.animationDuration = dur + "s";
        el.style.animationFillMode = "forwards";
        parent.appendChild(el);
        setTimeout(() => el.remove(), parseFloat(dur) * 1000 + 100);
      }

      function spawnSpark(parent, colors) {
        const count = 3 + Math.floor(Math.random() * 4);
        for (let i = 0; i < count; i++) {
          const el = document.createElement("div");
          el.className = "particle spark";
          const angle = Math.random() * 360;
          const dist = 30 + Math.random() * 120;
          const dx =
            (Math.cos((angle * Math.PI) / 180) * dist).toFixed(1) + "px";
          const dy =
            (Math.sin((angle * Math.PI) / 180) * dist - 80).toFixed(1) + "px";
          el.style.setProperty("--dx", dx);
          el.style.setProperty("--dy", dy);
          el.style.left = 10 + Math.random() * 80 + "vw";
          el.style.top = 10 + Math.random() * 80 + "vh";
          el.style.width = el.style.height = 3 + Math.random() * 7 + "px";
          el.style.background =
            colors[Math.floor(Math.random() * colors.length)];
          const dur = (0.5 + Math.random() * 1).toFixed(2);
          el.style.animationDuration = dur + "s";
          el.style.animationFillMode = "forwards";
          parent.appendChild(el);
          setTimeout(() => el.remove(), parseFloat(dur) * 1000 + 100);
        }
      }

      const questions = [
        "1. Дорогая моя, я тебя неделю называл кошечкой, тебе понравилось?",
        "2. Хочешь, чтобы я продолжал называть тебя кошечкой?",
        "3. А ты знаешь, что ты — самая красивая кошечка на свете?",
        "4. Ты согласна быть моей кошечкой навсегда?",
      ];
      let currentQuestion = 0;

      function startQuestions() {
        document.getElementById("main").style.display = "none";

        const anim = document.getElementById("anim");
        anim.style.display = "block";

        const hearts = ["❤️", "💖", "💗", "💓", "💝", "🩷"];
        const sparkColors = ["#fff", "#ffb6c1", "#ffe4e1", "#ffd700", "#fff0f5", "#ff85c2"];

        for (let i = 0; i < 50; i++) {
          setTimeout(() => {
            spawnHeart(anim, hearts);
            spawnSpark(anim, sparkColors);
            spawnGlow(anim);
          }, i * 45);
        }

        setTimeout(() => {
          anim.style.display = "none";
          currentQuestion = 0;
          showQuestion(currentQuestion);
          const overlay = document.getElementById("questions-overlay");
          overlay.style.display = "flex";
        }, 2500);
      }

      function showQuestion(index) {
        const text = document.getElementById("question-text");
        const buttons = document.getElementById("question-buttons");
        const final = document.getElementById("questions-final");

        text.style.display = "block";
        buttons.style.display = "flex";
        final.style.display = "none";

        text.style.animation = "none";
        text.offsetHeight;
        text.style.animation = "popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275)";
        text.textContent = questions[index];
      }

      function answerYes() {
        currentQuestion++;
        if (currentQuestion >= questions.length) {
          document.getElementById("question-text").style.display = "none";
          document.getElementById("question-buttons").style.display = "none";
          const final = document.getElementById("questions-final");
          final.style.display = "block";
          final.textContent = "Я так и знал! Люблю тебя, моя кошечка ❤️🐱";

          const anim = document.getElementById("question-anim");
          const hearts = ["❤️", "💖", "💗", "💓", "💝", "🩷", "🐱"];
          const sparkColors = ["#fff", "#ffb6c1", "#ffd700", "#ff85c2"];
          for (let i = 0; i < 60; i++) {
            setTimeout(() => {
              spawnHeart(anim, hearts);
              spawnSpark(anim, sparkColors);
            }, i * 50);
          }
        } else {
          showQuestion(currentQuestion);
        }
      }

      function answerNo() {
        const text = document.getElementById("question-text");
        text.classList.remove("shake");
        text.offsetHeight;
        text.classList.add("shake");

        const anim = document.getElementById("question-anim");
        const redEmojis = ["😠", "❌", "🚫", "😤", "💔", "😒", "🙅"];
        for (let i = 0; i < 30; i++) {
          setTimeout(() => spawnRedEmoji(anim, redEmojis), i * 60);
        }
      }

      function spawnRedEmoji(parent, emojis) {
        const el = document.createElement("div");
        el.className = "particle heart";
        el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        el.style.left = Math.random() * 100 + "vw";
        el.style.top = 60 + Math.random() * 40 + "vh";
        el.style.fontSize = 1.5 + Math.random() * 2 + "rem";
        const dur = (1.2 + Math.random() * 1.2).toFixed(2);
        el.style.animationDuration = dur + "s";
        el.style.animationFillMode = "forwards";
        parent.appendChild(el);
        setTimeout(() => el.remove(), parseFloat(dur) * 1000 + 100);
      }

      function spawnGlow(parent) {
        const el = document.createElement("div");
        el.className = "glow";
        const size = 20 + Math.random() * 60;
        el.style.width = el.style.height = size + "px";
        el.style.left = Math.random() * 100 + "vw";
        el.style.top = Math.random() * 100 + "vh";
        const hue =
          Math.random() > 0.5
            ? "rgba(255,255,255,0.8)"
            : "rgba(255,150,200,0.7)";
        el.style.background = hue;
        el.style.boxShadow = `0 0 ${size}px ${size / 2}px ${hue}`;
        const dur = (0.4 + Math.random() * 0.8).toFixed(2);
        el.style.animationDuration = dur + "s";
        parent.appendChild(el);
        setTimeout(() => el.remove(), 1200);
      }
    </script>
  </body>
</html>
